<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教室マップ</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🏫 教室マップ</h3>
        <div>
            <a href="/teacher/reservations" class="btn btn-outline-primary me-2">予約一覧へ</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-secondary">ログアウト</button>
            </form>
        </div>
    </div>

    <p class="text-muted">教室をクリックするとその日の時間割が確認できます</p>

    <!-- 階ごとに表示 -->
    <div th:each="entry : ${floorMap}" class="mb-4">
        <h5 class="fw-bold border-bottom pb-1"
            th:text="${entry.key}"></h5>

        <div class="row g-3">
            <div th:each="c : ${entry.value}" class="col-md-3">
                <a th:href="@{/teacher/classroom/{id}/timetable(id=${c.id})}"
                   class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-primary">
                        <div class="card-body text-center">
                            <h5 class="card-title text-primary" th:text="${c.name}"></h5>
                            <p class="card-text text-muted mb-1" th:text="${c.location}"></p>
                            <span class="badge bg-secondary"
                                  th:text="'定員 ' + ${c.capacity} + ' 人'"></span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div th:if="${entry.value.isEmpty()}" class="text-muted ms-2">
            教室がありません
        </div>
    </div>
</div>
</body>
</html>
