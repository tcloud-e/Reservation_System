# ===== MySQL Database Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/classroom_reservation_db?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=classroom_user
spring.datasource.password=classroom_password

# ===== JPA / Hibernate Configuration =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf Configuration =====
spring.thymeleaf.cache=false

# ===== Server Configuration =====
server.port=8080
