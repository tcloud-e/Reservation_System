<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>自分の予約一覧</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📋 自分が作成した授業（講師）</h3>
        <div>
            <a href="/teacher/reservations/new" class="btn btn-primary me-2">＋新規予約</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-secondary">ログアウト</button>
            </form>
        </div>
        <!---教室予約状況確認ページ-->
        <a href="/teacher/room_status.html" class="btn btn-outline-info mb-3">教室予約状況</a>
    </div>

    <table class="table table-bordered table-striped table-hover">
        <thead class="table-primary">
        <tr>
            <th>日付</th><th>コマ</th><th>時間</th><th>科目</th>
            <th>教室</th><th>場所</th><th>予約状況</th><th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservations}">
            <td th:text="${r.date}"></td>
            <td th:text="${r.period} + 'コマ目'"></td>
            <td th:text="${r.startTime} + '〜' + ${r.endTime}"></td>
            <td><span class="badge bg-primary" th:text="${r.subject}"></span></td>
            <td th:text="${r.classroom.name}"></td>
            <td th:text="${r.classroom.location}"></td>
            <td>
                <span th:text="${r.bookings.size()} + '/' + ${r.capacity} + '人'"></span>
            </td>
            <td>
                <form th:action="@{/teacher/reservations/{id}/delete(id=${r.id})}"
                      method="post" class="m-0"
                      onsubmit="return confirm('この予約を取消しますか？')">
                    <button type="submit" class="btn btn-sm btn-danger">取消</button>
                </form>
            </td>
        </tr>
        <tr th:if="${reservations.isEmpty()}">
            <td colspan="8" class="text-center text-muted">作成した授業がありません</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
