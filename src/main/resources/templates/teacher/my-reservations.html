<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>自分の予約一覧</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>自分が作成した授業（講師）</h3>
        <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">ログアウト</button></form>
    </div>

    <a href="/teacher/reservations/new" class="btn btn-primary mb-3">＋新規予約</a>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-light">
        <tr><th>日付</th><th>時間</th><th>教室</th><th>授業名</th><th>予約状況</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservations}">
            <td th:text="${r.date}"></td>
            <td th:text="${r.startTime} + '〜' + ${r.endTime}"></td>
            <td th:text="${r.classroom.name}"></td>
            <td th:text="${r.subject}"></td>
            <td th:text="${r.bookings.size()} + '/' + ${r.capacity}"></td>
            <td>
                <form th:action="@{/teacher/reservations/{id}/delete(id=${r.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-danger">取消</button>
                </form>
            </td>
        </tr>
        <tr th:if="${reservations.isEmpty()}">
            <td colspan="6" class="text-center text-muted">作成した授業がありません</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
