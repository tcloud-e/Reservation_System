<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>授業予約</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>受講可能な授業一覧（生徒）</h3>
        <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">ログアウト</button></form>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-light">
        <tr><th>日付</th><th>時間</th><th>教室</th><th>授業名</th><th>講師</th><th>空き</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservations}">
            <td th:text="${r.date}"></td>
            <td th:text="${r.startTime} + '〜' + ${r.endTime}"></td>
            <td th:text="${r.classroom.name}"></td>
            <td th:text="${r.subject}"></td>
            <td th:text="${r.teacher.fullName}"></td>
            <td th:text="${r.bookings.size()} + '/' + ${r.capacity}"></td>
            <td>
                <form th:action="@{/student/reservations/{id}/book(id=${r.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-primary">予約</button>
                </form>
            </td>
        </tr>
        <tr th:if="${reservations.isEmpty()}">
            <td colspan="7" class="text-center text-muted">現在受講可能な授業はありません</td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-5">自分の予約済み授業</h4>
    <ul>
        <li th:each="b : ${myBookings}"
            th:text="${b.reservation.date} + ' ' + ${b.reservation.subject} + '（' + ${b.reservation.classroom.name} + '）'"></li>
        <li th:if="${myBookings.isEmpty()}" class="text-muted">予約済みの授業はありません</li>
    </ul>
</div>
</body>
</html>
