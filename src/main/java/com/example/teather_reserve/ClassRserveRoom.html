<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遷移確認ページ</title>
    <link rel="stylesheet" href="css/classRoom.css">
</head>
<body>

    <div class="container">
        <h1>📅 遷移に成功しました！</h1>
        <p>クリックされた日付は以下の通りです：</p>
        
        <div class="date-display" id="clickedDate">読み込み中...</div>
        
        <br>
        <a href="#" class="back-btn" onclick="history.back(); return false;">カレンダーに戻る</a>
    </div>

    <script>
        // URLの「?date=YYYY-MM-DD」の部分を解析する関数
        function getParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // ページが読み込まれたら実行
        window.onload = function() {
            const dateParam = getParam('date'); // URLから "date" の値を取得

            const displayDiv = document.getElementById('clickedDate');

            if (dateParam) {
                // "2026-06-30" のような文字列を分解して見やすく整形
                const [year, month, day] = dateParam.split('-');
                displayDiv.textContent = `${year}年${month}月${day}日`;
            } else {
                displayDiv.textContent = '日付データがありません';
                displayDiv.style.background = '#ffe3e3';
                displayDiv.style.color = '#ff006e';
            }
        }
    </script>
</body>
</html>
