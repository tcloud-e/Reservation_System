<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遷移確認ページ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #eef2f3;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2b2d42;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .date-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #3a86ff;
            background: #e8f1ff;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin: 20px 0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            color: #666;
            text-decoration: none;
            border: 1px solid #ccc;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #f4f4f4;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📅 遷移に成功しました！</h1>
        <p>クリックされた日付は以下の通りです：</p>
        
        <div class="date-display" id="clickedDate">読み込み中...</div>
        
        <br>
        <a href="#" class="back-btn" onclick="history.back(); return false;">カレンダーに戻る</a>
    </div>

    <script>
        // URLの「?date=YYYY-MM-DD」の部分を解析する関数
        function getParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // ページが読み込まれたら実行
        window.onload = function() {
            const dateParam = getParam('date'); // URLから "date" の値を取得

            const displayDiv = document.getElementById('clickedDate');

            if (dateParam) {
                // "2026-06-30" のような文字列を分解して見やすく整形
                const [year, month, day] = dateParam.split('-');
                displayDiv.textContent = `${year}年${month}月${day}日`;
            } else {
                displayDiv.textContent = '日付データがありません';
                displayDiv.style.background = '#ffe3e3';
                displayDiv.style.color = '#ff006e';
            }
        }
    </script>
</body>
</html>
